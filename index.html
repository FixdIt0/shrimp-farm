<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$SHRIMP — The Farm</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f0ebe3;--card:#fff;--border:#e0d8cc;--accent:#ff6b4a;--accent2:#4a9eff;--green:#2ecc71;--text:#1a1a1a;--dim:#888;--mono:'JetBrains Mono',monospace;--sans:'DM Sans',sans-serif;--water:#1a3a4a;--sand:#c4a96a;--pond:#1e4d5e}
body{background:var(--bg);font-family:var(--sans);color:var(--text);overflow-x:hidden}

/* NAV */
nav{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.nav-brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.nav-brand span{color:var(--accent)}
.nav-links{display:flex;gap:16px;align-items:center}
.nav-links a{color:var(--dim);text-decoration:none;font-size:13px;font-weight:500;transition:color .2s}
.nav-links a:hover,.nav-links a.active{color:var(--text)}
.nav-pill{background:var(--accent);color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600}

/* FARM VIEW */
.farm-wrap{position:relative;width:100%;height:calc(100dvh - 49px);overflow:hidden;background:linear-gradient(180deg,#87CEEB 0%,#a8d8ea 30%,#c4e0c4 50%,#8fbc8f 60%,var(--sand) 70%,var(--sand) 100%)}

/* WATER */
.pond{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 40% 40%,#2a7a9a,var(--pond));box-shadow:inset 0 4px 20px rgba(0,0,0,.2),0 2px 8px rgba(0,0,0,.1);overflow:hidden}
.pond::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15) 0%,transparent 50%);border-radius:50%}
.pond-1{width:320px;height:220px;left:10%;top:35%}
.pond-2{width:260px;height:180px;right:15%;top:40%}
.pond-3{width:200px;height:140px;left:40%;top:55%}

/* RIPPLES */
.ripple{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.15);animation:ripple 3s ease-out infinite}
@keyframes ripple{0%{width:0;height:0;opacity:.4}100%{width:60px;height:40px;opacity:0;margin-left:-30px;margin-top:-20px}}

/* GROUND DETAILS */
.grass{position:absolute;width:8px;height:16px;background:linear-gradient(to top,#6a9a4a,#8fbc6f);border-radius:50% 50% 0 0;transform-origin:bottom}
.rock{position:absolute;background:radial-gradient(ellipse at 40% 30%,#a09080,#706050);border-radius:40% 50% 45% 55%}
.flower{position:absolute;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.3)}

/* STATIONS */
.station{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:transform .2s}
.station:hover{transform:scale(1.05)}
.station-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.station-label{font-size:10px;font-weight:600;color:#fff;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:8px;white-space:nowrap;backdrop-filter:blur(4px)}

/* SHRIMP */
.shrimp{position:absolute;transition:left 2s ease-in-out,top 2s ease-in-out;z-index:10;cursor:pointer}
.shrimp:hover .shrimp-body{transform:scale(1.2)}
.shrimp-body{width:28px;height:18px;border-radius:14px 14px 8px 8px;position:relative;transition:transform .2s;animation:bob 1.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.shrimp-eye{position:absolute;width:5px;height:5px;background:#fff;border-radius:50%;top:3px;right:5px;box-shadow:inset 1.5px 0 0 #111}
.shrimp-tail{position:absolute;left:-6px;top:6px;width:10px;height:6px;border-radius:0 0 6px 6px;opacity:.7}
.shrimp-antenna{position:absolute;right:2px;top:-4px;width:1px;height:8px;transform:rotate(20deg);transform-origin:bottom}
.shrimp-antenna2{position:absolute;right:6px;top:-3px;width:1px;height:6px;transform:rotate(-15deg);transform-origin:bottom}

/* SPEECH BUBBLE */
.bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#fff;color:var(--text);font-size:10px;font-family:var(--sans);padding:4px 10px;border-radius:10px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.1);opacity:0;transition:opacity .3s;pointer-events:none;font-weight:500;margin-bottom:6px}
.bubble::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:#fff}
.shrimp.talking .bubble{opacity:1}

/* NAME TAG */
.shrimp-tag{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:8px;font-family:var(--mono);font-weight:600;white-space:nowrap;margin-top:4px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}

/* INFO PANEL */
.info{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:16px 24px;display:flex;gap:24px;align-items:center;z-index:40;transform:translateY(100%);transition:transform .3s ease;box-shadow:0 -4px 20px rgba(0,0,0,.08)}
.info.open{transform:translateY(0)}
.info-close{position:absolute;top:12px;right:16px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--dim)}
.info-avatar{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.info-text h3{font-size:15px;margin-bottom:2px}
.info-text p{font-size:12px;color:var(--dim)}
.info-log{flex:1;font-family:var(--mono);font-size:11px;color:var(--dim);max-height:60px;overflow-y:auto;background:#f8f6f2;padding:8px 12px;border-radius:8px;line-height:1.6}
.info-log .active-line{color:var(--green);font-weight:500}

/* HUD OVERLAY */
.hud-overlay{position:absolute;top:12px;left:12px;display:flex;gap:8px;z-index:20}
.hud-chip{background:rgba(255,255,255,.85);backdrop-filter:blur(8px);padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;gap:6px}
.hud-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* CLOUDS */
.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.6;animation:drift linear infinite}
@keyframes drift{0%{transform:translateX(-200px)}100%{transform:translateX(calc(100vw + 200px))}}

@media(max-width:768px){
  .pond-1{width:200px;height:140px;left:5%;top:40%}
  .pond-2{width:160px;height:110px;right:5%;top:45%}
  .pond-3{display:none}
  .hud-overlay{flex-wrap:wrap}
  .info{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>

<nav>
  <div class="nav-brand">🦐 <span>$SHRIMP</span></div>
  <div class="nav-links">
    <a href="index.html" class="active">Farm</a>
    <a href="feed.html">Feed</a>
    <a href="#">Jupiter</a>
    <a href="#">Pump.fun</a>
    <a href="#">X</a>
    <a href="#" class="nav-pill">Buy $SHRIMP</a>
  </div>
</nav>

<div class="farm-wrap" id="farm">
  <!-- CLOUDS -->
  <div class="cloud" style="width:120px;height:40px;top:5%;animation-duration:45s"></div>
  <div class="cloud" style="width:80px;height:28px;top:12%;animation-duration:60s;animation-delay:-20s;opacity:.4"></div>
  <div class="cloud" style="width:100px;height:35px;top:8%;animation-duration:55s;animation-delay:-35s;opacity:.5"></div>

  <!-- HUD -->
  <div class="hud-overlay">
    <div class="hud-chip"><div class="dot"></div> 5 Shrimp Active</div>
    <div class="hud-chip">📋 <span id="taskCount">0</span> Tasks</div>
    <div class="hud-chip">⚡ 12,847 Credits</div>
  </div>

  <!-- PONDS -->
  <div class="pond pond-1" id="pond1"></div>
  <div class="pond pond-2" id="pond2"></div>
  <div class="pond pond-3" id="pond3"></div>

  <!-- STATIONS -->
  <div class="station" style="left:8%;top:22%"><div class="station-icon" style="background:#4a9eff">🔍</div><div class="station-label">Tweet Scanner</div></div>
  <div class="station" style="right:10%;top:20%"><div class="station-icon" style="background:#ff6b4a">🎨</div><div class="station-label">Meme Lab</div></div>
  <div class="station" style="left:45%;top:18%"><div class="station-icon" style="background:#9b59b6">📊</div><div class="station-label">Trend HQ</div></div>
  <div class="station" style="left:25%;top:70%"><div class="station-icon" style="background:#2ecc71">🧵</div><div class="station-label">Thread Desk</div></div>
  <div class="station" style="right:20%;top:72%"><div class="station-icon" style="background:#e74c3c">🔥</div><div class="station-label">Roast Pit</div></div>
</div>

<!-- INFO PANEL -->
<div class="info" id="infoPanel">
  <button class="info-close" onclick="document.getElementById('infoPanel').classList.remove('open')">&times;</button>
  <div class="info-avatar" id="infoAvatar">🦐</div>
  <div class="info-text"><h3 id="infoName">—</h3><p id="infoRole">—</p></div>
  <div class="info-log" id="infoLog"></div>
</div>

<script>
const shrimps=[
  {name:'SHRIMP-01',role:'Tweet Scout',color:'#ff6b4a',station:0,actions:['scanning crypto twitter...','found 23 trending mentions','analyzing sentiment: 78% bullish','flagging whale transfer: 500K SOL','compiling hourly report...','report pushed to feed ✓']},
  {name:'SHRIMP-02',role:'Meme Generator',color:'#4a9eff',station:1,actions:['loading meme templates...','selected: distracted boyfriend','generating caption with GPT-4o...','rendering image 1080x1080...','applying $SHRIMP watermark...','meme posted to X ✓']},
  {name:'SHRIMP-03',role:'Trend Analyst',color:'#9b59b6',station:2,actions:['pulling DexScreener data...','analyzing volume patterns...','detected unusual accumulation','cross-referencing deployers...','running momentum algorithm...','alpha report generated ✓']},
  {name:'SHRIMP-04',role:'Thread Writer',color:'#2ecc71',station:3,actions:['received topic from SHRIMP-03','researching via DefiLlama API...','drafting 7-tweet thread...','writing hook with key stat...','quality check passed','thread posted to X ✓']},
  {name:'SHRIMP-05',role:'Wallet Roaster',color:'#e74c3c',station:4,actions:['received wallet: 7xKp...F3mQ','pulling 2,847 transactions...','analyzing: 94% meme swaps','avg hold time: 7 minutes','generating roast card...','roast posted to feed ✓']},
];

const stationPositions=[
  {x:12,y:28},{x:78,y:26},{x:48,y:24},{x:28,y:74},{x:72,y:76}
];
const pondPositions=[
  {x:18,y:42},{x:72,y:48},{x:45,y:60}
];

let taskCount=0;
const farm=document.getElementById('farm');

// Create shrimp elements
const shrimpEls=shrimps.map((s,i)=>{
  const el=document.createElement('div');
  el.className='shrimp';
  const startPond=pondPositions[i%3];
  el.style.left=startPond.x+'%';
  el.style.top=startPond.y+'%';
  el.innerHTML=`
    <div class="bubble" id="bubble-${i}"></div>
    <div class="shrimp-body" style="background:${s.color}">
      <div class="shrimp-eye"></div>
      <div class="shrimp-tail" style="background:${s.color}"></div>
      <div class="shrimp-antenna" style="background:${s.color}"></div>
      <div class="shrimp-antenna2" style="background:${s.color}"></div>
    </div>
    <div class="shrimp-tag">${s.name}</div>
  `;
  el.onclick=()=>showInfo(i);
  farm.appendChild(el);
  return el;
});

// Add ripples to ponds
document.querySelectorAll('.pond').forEach(pond=>{
  setInterval(()=>{
    const r=document.createElement('div');
    r.className='ripple';
    r.style.left=Math.random()*60+20+'%';
    r.style.top=Math.random()*60+20+'%';
    pond.appendChild(r);
    setTimeout(()=>r.remove(),3000);
  },2000+Math.random()*3000);
});

// Add ground details
for(let i=0;i<30;i++){
  const g=document.createElement('div');
  g.className='grass';
  g.style.left=Math.random()*100+'%';
  g.style.top=65+Math.random()*30+'%';
  g.style.transform=`rotate(${Math.random()*20-10}deg)`;
  g.style.opacity=0.4+Math.random()*0.4;
  farm.appendChild(g);
}
for(let i=0;i<8;i++){
  const r=document.createElement('div');
  r.className='rock';
  r.style.width=8+Math.random()*16+'px';
  r.style.height=6+Math.random()*10+'px';
  r.style.left=Math.random()*90+5+'%';
  r.style.top=62+Math.random()*32+'%';
  farm.appendChild(r);
}

// Agent activity loop
const agentState=shrimps.map(()=>({actionIdx:0,phase:'pond',log:[]}));

function moveShrimp(i){
  const s=shrimps[i];
  const el=shrimpEls[i];
  const state=agentState[i];
  const action=s.actions[state.actionIdx%s.actions.length];
  const isLast=(state.actionIdx%s.actions.length)===s.actions.length-1;

  if(state.phase==='pond'){
    // Move to station
    const st=stationPositions[s.station];
    el.style.left=st.x+'%';
    el.style.top=st.y+'%';
    state.phase='working';
  }else{
    // Move back to pond
    const p=pondPositions[i%3];
    el.style.left=(p.x+Math.random()*10-5)+'%';
    el.style.top=(p.y+Math.random()*6-3)+'%';
    state.phase='pond';
  }

  // Show bubble
  const bubble=document.getElementById('bubble-'+i);
  bubble.textContent=action;
  el.classList.add('talking');
  setTimeout(()=>el.classList.remove('talking'),2500);

  state.log.push(action);
  if(state.log.length>10)state.log.shift();

  if(isLast){
    taskCount++;
    document.getElementById('taskCount').textContent=taskCount;
  }
  state.actionIdx++;
}

// Stagger agent loops
shrimps.forEach((_,i)=>{
  const interval=4000+i*800;
  setTimeout(()=>{
    moveShrimp(i);
    setInterval(()=>moveShrimp(i),interval);
  },1000+i*600);
});

// Info panel
function showInfo(i){
  const s=shrimps[i];
  const state=agentState[i];
  document.getElementById('infoAvatar').style.background=s.color;
  document.getElementById('infoName').textContent=s.name;
  document.getElementById('infoRole').textContent=s.role;
  document.getElementById('infoLog').innerHTML=state.log.map((l,j)=>
    `<div class="${j===state.log.length-1?'active-line':''}">${l}</div>`
  ).join('');
  document.getElementById('infoPanel').classList.add('open');
}
</script>
</body>
</html>
